  - issue_id: NL-2977-B

    eu_question: >
      Whether the applicable EU-law provision required the national
      authorities to refer the matter concerning the implementation of the
      Temporary Protection Directive to the Council under Article 28(5) TEU,
      or whether Article 78(3) TFEU applied.

    eu_provision: "Article 28(5) TEU; Article 78(3) TFEU"

    relevance: >
      The question was addressed by the court because the appellant disputed
      the legal basis used by the lower court.

    ground_raw: >
      Uit het voorgaande volgt dat redelijkerwijs geen twijfel kan bestaan
      over het antwoord op de opgeworpen vraag.

