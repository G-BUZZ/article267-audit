  - issue_id: NL-3137-B

    eu_question: >
      Whether the first and fourth grounds of appeal raise a question
      concerning the interpretation or validity of a provision of
      European Union law.

    eu_provision: null

    relevance: >
      No Article 267 EU-law question arises because the first and fourth
      grounds do not concern the interpretation or validity of EU law.

    ground_raw: >
      In de eerste en vierde grief zijn geen vragen aan de orde over de
      uitleg of de geldigheid van een bepaling van Unierecht.

    eu_question_status: NO_EU_QUESTION


    non_referral_ground: null
