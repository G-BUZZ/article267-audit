      accessed: 2026-09-05

    confidence: HIGH

    analyst_note: >
      In §1 the court resolves the substantive EU-law question by
      distinguishing Aroja, point 73, which concerns detention under
      Article 15 of the Return Directive for the execution of a return
      decision, from detention under Article 59b Vw 2000, and by finding
      confirmation in Kadzoev, points 40-48. In §1.1 the court states that
      the question can be answered on the basis of CJEU case-law and,
      referring to Cilfit, Consorzio Italian Management and Remling,
      declines to make a preliminary reference.
