ecli: ECLI:NL:RVS:2026:4092

issues:
  - issue_id: NL-4092-A

    eu_question: >
      Whether a period of detention under Article 59b of the Dutch
      Aliens Act 2000 must be counted when calculating the maximum
      detention period under Article 59(5) and (6) of the same Act.

    eu_provision: >
      Article 15 Return Directive;
      Article 59b Vw 2000;
      Article 59(5) and (6) Vw 2000

    relevance: >
      The question concerns the calculation of the maximum period of
      immigration detention and was relevant to the lawfulness of the
      detention.

    ground_raw: >
      Uit het voorgaande volgt dat de opgeworpen vraag kan worden
      beantwoord aan de hand van de rechtspraak van het Hof.

    eu_question_status: EU_QUESTION


    non_referral_ground: ECL
