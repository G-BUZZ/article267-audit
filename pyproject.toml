[project]
name = "article267-audit"
version = "0.1.0"
description = "Issue-level comparative audit of Article 267(3) TFEU reasoning"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
